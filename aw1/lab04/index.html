<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Library</title>
    <meta name="author" content="Andrei Daniel Stefan">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <style>
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        main {
            flex-grow: 1;
            overflow: hidden;
        }
    </style>
</head>



<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-primary" >
            <div class="container-fluid d-flex align-items-center">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon navbar-dark "></span>
                </button>

                <div class="navbar-brand d-flex align-items-center mx-auto mx-lg-0">
                    <i class="bi bi-collection-play fs-4 text-white me-2"></i>
                    <h1 class="h4 mb-0 text-white">Film Library</h1>
                </div>

                <div class="order-lg-last ms-2">
                    <i class="bi bi-person-circle text-white fs-3"></i>
                </div>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <form class="d-flex mt-3 mt-lg-0 ms-lg-auto col-lg-6" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    </form>
                    
                    <div class="d-lg-none mt-3 d-flex flex-column gap-2 border-top pt-3">
                        <h5 class="text-white">Filters</h5>
                        <button class="btn btn-outline-light text-start active">All</button>
                        <button class="btn btn-outline-light text-start">Favorite</button>
                        <button class="btn btn-outline-light text-start">Best Rated</button>
                        <button class="btn btn-outline-light text-start">Seen Last Month</button>
                        <button class="btn btn-outline-light text-start">Unseen</button>
                    </div>
                    

                    <ul class="navbar-nav mb-2 mb-lg-0">
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid">
        <div class="row h-100">
            
            <section class="col-lg-2 d-none d-lg-block bg-light px-3">
                <h5 class="mt-3">Filters</h5>
                <div class="d-flex flex-column gap-2">
                    <button class="btn btn-primary text-start active">All</button>
                    <button class="btn btn-outline-dark border-0 text-start">Favorite</button>
                    <button class="btn btn-outline-dark border-0 text-start">Best Rated</button>
                    <button class="btn btn-outline-dark border-0 text-start">Seen Last Month</button>
                    <button class="btn btn-outline-dark border-0 text-start">Unseen</button>
                </div>
            </section>

            <section class="col-lg-10 col-12 p-4">
                <h1>All Films</h1>

                <table class="table">
                    <tbody>
                        <tr>
                            <td class="align-middle"><i class="bi bi-heart-fill text-danger pe-2"></i>Pulp Fiction</td>
                            <td class="text-center align-middle">March, 24 2026</td>
                            <td class="text-end">
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star"></i>
                                <i class="bi bi-star"></i>
                                <i class="bi bi-star"></i>
                                <button class="btn"><i class="bi bi-pencil"></i></button>
                                <button class="btn"><i class="bi bi-trash"></i></button>
                            </td>
                            </tr>
                        
                        <tr>
                            <td class="align-middle"><i class="bi bi-heart pe-2"></i>21 Grams</td>
                            <td class="text-center align-middle">March, 10 2026</td>
                            <td class="text-end">
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-half text-warning"></i>
                                <i class="bi bi-star"></i>
                                <button class="btn"><i class="bi bi-pencil"></i></button>
                                <button class="btn"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        
                        <tr>
                            <td class="align-middle"><i class="bi bi-heart pe-2"></i>Shrek 2</td>
                            <td class="text-center align-middle">January, 24 2026</td>
                            <td class="text-end">
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-fill text-warning"></i>
                                <i class="bi bi-star-half text-warning"></i>
                                <i class="bi bi-star"></i>
                                <i class="bi bi-star"></i>
                                <button class="btn"><i class="bi bi-pencil"></i></button>
                                <button class="btn"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            
            </section>
            
        </div>
    </main>


    <footer class="fixed-bottom d-flex justify-content-end p-3 pe-4">
        <button class="btn p-0 border-0">
            <i class="bi bi-plus-circle-fill text-primary display-4"></i>
        </button>
    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
